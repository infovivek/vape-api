version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vapt
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      VAPT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/vapt
      VAPT_JWT_SECRET: dev-secret
      VAPT_ENCRYPTION_KEY: ${VAPT_ENCRYPTION_KEY:-}
      VAPT_CELERY_BROKER_URL: redis://redis:6379/0
      VAPT_CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      VAPT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/vapt
      VAPT_JWT_SECRET: dev-secret
      VAPT_ENCRYPTION_KEY: ${VAPT_ENCRYPTION_KEY:-}
      VAPT_CELERY_BROKER_URL: redis://redis:6379/0
      VAPT_CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  db_data:
