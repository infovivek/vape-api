openapi: 3.0.1
info:
  title: Demo API
  version: 1.0.0
paths:
  /demo/users:
    get:
      summary: List users
      responses:
        '200':
          description: OK
    post:
      summary: Create user
      requestBody:
        content:
          application/json:
            example:
              name: "Alice"
              email: "alice@example.com"
      responses:
        '201':
          description: Created
  /demo/users/{userId}:
    get:
      summary: Fetch user
      parameters:
        - in: path
          name: userId
          schema:
            type: string
      responses:
        '200':
          description: OK
